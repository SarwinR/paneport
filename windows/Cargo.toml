[package]
name = "paneport-receiver"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Shows a Mac's Paneport virtual displays on this Windows PC's monitors."
rust-version = "1.80"
publish = false

[[bin]]
name = "PaneportReceiver"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
base64 = "0.22"
png = "0.17"
tungstenite = "0.24"
winit = "0.30"

[target.'cfg(windows)'.dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Power",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
lto = true
codegen-units = 1
